apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["aiops.example.com"]
    resources: ["incidents", "incidents/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-role-binding
subjects:
  - kind: ServiceAccount
    name: aiops-sa
    namespace: default
roleRef:
  kind: Role
  name: aiops-role
  apiGroup: rbac.authorization.k8s.io

apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-incident-role
rules:
  - apiGroups: ["aiops.example.com"]
    resources: ["incidents", "incidents/status"]
    verbs: ["create", "get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-incident-role-binding
subjects:
  - kind: ServiceAccount
    name: agent-sa
    namespace: default
roleRef:
  kind: Role
  name: agent-incident-role
  apiGroup: rbac.authorization.k8s.io

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcp-server }
  template:
    metadata:
      labels: { app: mcp-server }
    spec:
      serviceAccountName: aiops-sa
      containers:
        - name: mcp-server
          image: "{{ .Values.mcpServer.image }}:{{ .Values.mcpServer.tag }}"
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
spec:
  selector: { app: mcp-server }
  ports:
    - port: 8080
      targetPort: 8080

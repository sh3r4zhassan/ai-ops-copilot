apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: incidents.aiops.example.com
spec:
  group: aiops.example.com
  names:
    kind: Incident
    listKind: IncidentList
    plural: incidents
    singular: incident
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                podName:
                  type: string
                namespace:
                  type: string
                symptom:
                  type: string
                approved:
                  type: boolean
              required: ["podName", "namespace", "symptom"]
            status:
              type: object
              properties:
                phase:
                  type: string
                diagnosis:
                  type: string
